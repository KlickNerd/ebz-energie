name: Google-Bewertungen aktualisieren

# Holt die echten Google-Rezensionen NUR selten (einmal im Monat) und auf
# Knopfdruck ("Run workflow"). Committet build/data/reviews.json; der Commit
# loest dann den normalen Deploy aus. So faellt beim normalen Arbeiten (Push)
# KEIN DataForSEO-API-Call an.
on:
  schedule:
    - cron: '0 5 1 * *'   # am 1. jedes Monats
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rezensionen abrufen (DataForSEO)
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python3 build/fetch_reviews.py
      - name: Aenderungen committen
        run: |
          git config user.name "reviews-bot"
          git config user.email "actions@users.noreply.github.com"
          git add build/data/reviews.json
          if git diff --staged --quiet; then
            echo "Keine Aenderungen an den Bewertungen."
          else
            git commit -m "chore: Google-Bewertungen automatisch aktualisiert"
            git push
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
        id: commit
      - name: Deploy anstossen (Actions-Push loest sonst keinen Workflow aus)
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy zu GitHub Pages" --ref main
