name: Deploy zu GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Kein Review-Fetch hier: der Deploy nutzt die eingecheckte
      # build/data/reviews.json (kein API-Call, keine Kosten pro Push).
      - name: Website bauen (mit Base-Path fuer Projektseite)
        env:
          EBZ_BASE: /ebz-energie
        run: |
          python3 build/build_all.py
          python3 build/fetch_images.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
